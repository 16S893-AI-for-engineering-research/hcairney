[project]
name = "pope-1975-reproduction"
version = "0.1.0"
description = "Verified derivation and reproduction of Pope (1975), Figure 1"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.0",
    "scipy>=1.14",
    "sympy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
